  <!-- Coastline glow and island details. -->
  <g stroke="#1caaff" stroke-opacity=".35" stroke-width="1" fill="none">
    <path d="M752 172 C812 190 860 233 895 271"/>
    <path d="M863 365 C826 394 808 424 774 458"/>
    <path d="M724 462 C690 506 643 533 585 605"/>
